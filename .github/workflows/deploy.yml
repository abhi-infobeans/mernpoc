name: Deploy React + Node to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout latest code
        uses: actions/checkout@v4


      # ==========================================
      # NODE SETUP
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ==========================================
      # FRONTEND BUILD
      # ==========================================

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React Frontend
        run: npm run build


      # ==========================================
      # BACKEND BUILD / INSTALL
      # ==========================================

      - name: Install Backend Dependencies
        working-directory: api
        run: npm ci --omit=dev

      # If your api/package.json has a build script,
      # uncomment the following step:
      #
      # - name: Build Node Backend
      #   working-directory: api
      #   run: npm run build


      # ==========================================
      # CREATE DEPLOYMENT PACKAGE
      # ==========================================

      - name: Create Deployment Package
        run: |
          echo "Creating deployment package..."

          tar -czf deploy.tar.gz \
            dist \
            api \
            docker-compose.yml

          ls -lh deploy.tar.gz


      # ==========================================
      # UPLOAD TO EC2
      # ==========================================

      - name: Copy files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ec2-user/"


      # ==========================================
      # DEPLOY TO EC2
      # ==========================================

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Starting Deployment"
            echo "======================================"


            # ======================================
            # CREATE APPLICATION DIRECTORY
            # ======================================

            echo "Creating application directory..."

            mkdir -p /home/ec2-user/mernpoc


            # ======================================
            # REMOVE OLD FRONTEND BUILD
            # ======================================

            echo "Removing old React build..."

            rm -rf /home/ec2-user/mernpoc/dist


            # ======================================
            # EXTRACT NEW BUILD
            # ======================================

            echo "Extracting latest deployment..."

            tar -xzf /home/ec2-user/deploy.tar.gz \
              -C /home/ec2-user/mernpoc

            rm -f /home/ec2-user/deploy.tar.gz


            # ======================================
            # START MYSQL
            # ======================================

            echo "Starting MySQL Docker container..."

            cd /home/ec2-user/mernpoc

            docker compose up -d


            echo "Checking Docker containers..."

            docker ps


            # ======================================
            # BACKEND
            # ======================================

            echo "Installing backend dependencies..."

            cd /home/ec2-user/mernpoc/api

            npm ci --omit=dev


            echo "Restarting Node.js API..."

            pm2 restart server || pm2 start Server.js --name server

            pm2 save


            # ======================================
            # FRONTEND
            # ======================================

            echo "Deploying React frontend..."

            sudo mkdir -p /usr/share/nginx/html

            sudo rm -rf /usr/share/nginx/html/*

            sudo cp -r /home/ec2-user/mernpoc/dist/* \
              /usr/share/nginx/html/


            # ======================================
            # NGINX
            # ======================================

            echo "Reloading Nginx..."

            sudo systemctl reload nginx


            # ======================================
            # STATUS
            # ======================================

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"

            echo "Docker:"
            docker ps

            echo ""
            echo "PM2:"
            pm2 status

            echo ""
            echo "Node Port:"
            ss -lntp | grep 5000 || true

            echo ""
            echo "Nginx:"
            sudo systemctl status nginx --no-pager
