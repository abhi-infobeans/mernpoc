name: Deploy React + Node to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout latest code
      # =========================

      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Setup Node
      # =========================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =========================
      # React
      # =========================

      - name: Install React dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      # =========================
      # Verify React build
      # =========================

      # =========================
      # Node API
      # =========================

      - name: Install API dependencies
        working-directory: api
        run: npm ci --omit=dev

      # =========================
      # Package application
      # =========================

      - name: Create deployment package
        run: |
          echo "===== Creating deployment package ====="
          tar -czf deploy.tar.gz dist api docker-compose.yml

          echo "===== Package created ====="
          ls -lh deploy.tar.gz

      # =========================
      # Upload to EC2
      # =========================

      - name: Copy files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ec2-user/"

      # =========================
      # Deploy on EC2
      # =========================

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            # =========================
            # Create application directory
            # =========================

            echo "===== Create application directory ====="

            mkdir -p /home/ec2-user/mernpoc

            # =========================
            # Remove old React build
            # =========================

            echo "===== Remove old React build ====="

            rm -rf /home/ec2-user/mernpoc/dist

            # =========================
            # Extract latest deployment
            # =========================

            echo "===== Extract latest deployment ====="

            tar -xzf /home/ec2-user/deploy.tar.gz \
              -C /home/ec2-user/mernpoc

            rm -f /home/ec2-user/deploy.tar.gz

            echo "===== Deployment package extracted ====="

            # =========================
            # Verify React build
            # =========================

            echo "===== Verify React build ====="

            echo "Checking for localhost:5000..."

            if grep -R "localhost:5000" /home/ec2-user/mernpoc/dist; then
              echo "ERROR: localhost:5000 found in deployed React build!"
              exit 1
            else
              echo "SUCCESS: localhost:5000 not found."
            fi

            echo "Checking for EC2 API URL..."

            grep -R "13.201.186.161:5000" \
              /home/ec2-user/mernpoc/dist || true

            # =========================
            # Start MySQL Docker
            # =========================

            echo "===== Start MySQL Docker ====="

            cd /home/ec2-user/mernpoc

            docker compose up -d

            # =========================
            # Check Docker
            # =========================

            echo "===== Check Docker ====="

            docker ps

            # =========================
            # Install API dependencies
            # =========================

            echo "===== Install API dependencies ====="

            cd /home/ec2-user/mernpoc/api

            npm ci --omit=dev

            # =========================
            # Restart Node API
            # =========================

            echo "===== Restart Node API ====="

            pm2 restart server || pm2 start Server.js --name server

            pm2 save

            # =========================
            # Deploy React to Nginx
            # =========================

            echo "===== Deploy React to Nginx ====="

            sudo mkdir -p /usr/share/nginx/html

            sudo rm -rf /usr/share/nginx/html/*

            sudo cp -r /home/ec2-user/mernpoc/dist/* \
              /usr/share/nginx/html/

            # =========================
            # Verify Nginx build
            # =========================

            echo "===== Verify Nginx React build ====="

            echo "Checking for localhost:5000..."

            if sudo grep -R "localhost:5000" /usr/share/nginx/html; then
              echo "ERROR: localhost:5000 found in Nginx files!"
              exit 1
            else
              echo "SUCCESS: localhost:5000 not found in Nginx files."
            fi

            echo "Checking deployed API URL..."

            sudo grep -R "13.201.186.161:5000" \
              /usr/share/nginx/html || true

            # =========================
            # Reload Nginx
            # =========================

            echo "===== Reload Nginx ====="

            sudo systemctl reload nginx

            # =========================
            # Final status
            # =========================

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"

            echo "===== Docker ====="

            docker ps

            echo "===== PM2 ====="

            pm2 status

            echo "===== Node Port ====="

            ss -lntp | grep 5000 || true
