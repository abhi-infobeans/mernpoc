name: Deploy React + Node to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout latest code
        uses: actions/checkout@v4


      # ==========================================
      # NODE SETUP
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ==========================================
      # FRONTEND
      # ==========================================

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React Frontend
        run: npm run build


      # ==========================================
      # BACKEND
      # ==========================================

      - name: Install Backend Dependencies
        working-directory: api
        run: npm ci --omit=dev


      # ==========================================
      # CREATE DEPLOYMENT PACKAGE
      # ==========================================

      - name: Create Deployment Package
        run: |
          echo "Creating deployment package..."

          tar -czf deploy.tar.gz \
            dist \
            api \
            docker-compose.yml

          ls -lh deploy.tar.gz


      # ==========================================
      # COPY TO EC2
      # ==========================================

      - name: Copy files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ec2-user/"


      # ==========================================
      # DEPLOY
      # ==========================================

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Starting Deployment"
            echo "======================================"


            # ======================================
            # APPLICATION DIRECTORY
            # ======================================

            mkdir -p /home/ec2-user/mernpoc


            # ======================================
            # REMOVE OLD BUILD
            # ======================================

            echo "Removing old React build..."

            rm -rf /home/ec2-user/mernpoc/dist


            # ======================================
            # EXTRACT BUILD
            # ======================================

            echo "Extracting deployment package..."

            tar -xzf /home/ec2-user/deploy.tar.gz \
              -C /home/ec2-user/mernpoc

            rm -f /home/ec2-user/deploy.tar.gz


            # ======================================
            # MYSQL
            # ======================================

            echo "Starting MySQL..."

            cd /home/ec2-user/mernpoc

            docker compose up -d

            docker ps


            # ======================================
            # BACKEND
            # ======================================

            echo "Installing backend dependencies..."

            cd /home/ec2-user/mernpoc/api

            npm ci --omit=dev


            echo "Restarting Node API..."

            pm2 restart server || pm2 start Server.js --name server

            pm2 save


            # ======================================
            # FRONTEND
            # ======================================

            echo "Deploying React frontend..."

            sudo mkdir -p /usr/share/nginx/html

            sudo rm -rf /usr/share/nginx/html/*

            sudo cp -r /home/ec2-user/mernpoc/dist/* \
              /usr/share/nginx/html/


            # ======================================
            # NGINX REACT CONFIGURATION
            # ======================================

            echo "Configuring Nginx..."

            sudo tee /etc/nginx/conf.d/react-app.conf > /dev/null <<'EOF'
            server {
                listen 80;
                server_name _;

                root /usr/share/nginx/html;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            EOF


            # ======================================
            # NGINX TEST
            # ======================================

            echo "Testing Nginx configuration..."

            sudo nginx -t


            # ======================================
            # RELOAD NGINX
            # ======================================

            echo "Reloading Nginx..."

            sudo systemctl enable nginx
            sudo systemctl reload nginx


            # ======================================
            # FINAL STATUS
            # ======================================

            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"

            echo ""
            echo "Docker:"
            docker ps

            echo ""
            echo "PM2:"
            pm2 status

            echo ""
            echo "Nginx:"
            sudo systemctl status nginx --no-pager

            echo ""
            echo "Ports:"
            ss -lntp | grep -E ':80|:5000' || true
